<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thermoduct Admin Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Thermoduct Admin Portal</h1>
            <p class="subtitle">Projectbeheer &amp; Installatie-invoer</p>
        </header>

        <!-- Project selectie uit Odoo -->
        <div class="project-section">
            <label for="projectZoek">Project (Odoo)</label>
            <div class="project-search">
                <input type="text" id="projectZoek" placeholder="Zoek project in Odoo..." autocomplete="off">
                <div class="project-dropdown hidden" id="projectDropdown"></div>
            </div>
            <div class="project-selected hidden" id="projectSelected">
                <div class="project-selected-info">
                    <strong id="projectSelectedNaam"></strong>
                    <span id="projectSelectedAdres" class="project-adres"></span>
                </div>
                <button type="button" class="btn btn-remove" onclick="clearProject()" title="Project wissen">&#x2715;</button>
            </div>
            <input type="hidden" id="projectOdooId">
            <div class="project-actions">
                <button type="button" class="btn btn-load" id="btnLaden" disabled>Laden uit Odoo</button>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button type="button" class="tab active" data-tab="invoer">Invoer</button>
            <button type="button" class="tab" data-tab="rolverdeling">Rolverdeling</button>
        </div>

        <!-- Tab: Invoer -->
        <div class="tab-content active" id="tab-invoer">
            <div id="blokkenContainer"></div>

            <div class="actions-bar">
                <button type="button" class="btn btn-add" id="btnAddBlok">+ Gebouw</button>
            </div>

            <div class="submit-bar">
                <button type="button" class="btn btn-save" id="btnOpslaan">Opslaan naar Odoo</button>
            </div>

            <div id="statusMsg" class="status-msg hidden"></div>
        </div>

        <!-- Tab: Rolverdeling -->
        <div class="tab-content" id="tab-rolverdeling">
            <div class="rv-layout">
                <div class="rv-main">
                    <div class="rv-rollen-config">
                        <h3>Beschikbare rollen</h3>
                        <div class="rv-rollen-lijst" id="rvRollenLijst"></div>
                        <div class="rv-rol-toevoegen">
                            <select id="rvRolGrootte">
                                <option value="600">600 m</option>
                                <option value="240">240 m</option>
                                <option value="200">200 m</option>
                                <option value="120">120 m</option>
                                <option value="100">100 m</option>
                            </select>
                            <input type="number" id="rvRolAantal" value="1" min="1" placeholder="Aantal">
                            <button type="button" class="btn btn-add" id="btnAddRol">+ Rol</button>
                        </div>
                    </div>

                    <div id="rvCollectorenOverzicht" class="rv-collectoren-overzicht"></div>
                </div>

                <div class="rv-sidebar">
                    <div class="rv-stats" id="rvStats"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
