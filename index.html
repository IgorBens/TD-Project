<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thermoduct Admin Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Login scherm -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-card">
            <h1>Thermoduct</h1>
            <p class="login-subtitle">Admin Portal</p>
            <form id="loginForm" onsubmit="return false;">
                <div class="login-field">
                    <label for="loginWachtwoord">Wachtwoord</label>
                    <input type="password" id="loginWachtwoord" placeholder="Voer wachtwoord in..." autofocus>
                </div>
                <button type="submit" class="btn btn-login" id="btnLogin">Inloggen</button>
                <div id="loginError" class="login-error hidden"></div>
            </form>
        </div>
    </div>

    <!-- Hoofdapplicatie (verborgen tot ingelogd) -->
    <div class="container hidden" id="appContainer">
        <header>
            <div class="header-bar">
                <div>
                    <h1>Thermoduct Admin Portal</h1>
                    <p class="subtitle">Projectbeheer &amp; Installatie-invoer</p>
                </div>
                <button type="button" class="btn btn-logout" id="btnLogout">Uitloggen</button>
            </div>
        </header>

        <!-- Project info (geladen via URL parameters vanuit Odoo) -->
        <div class="project-section">
            <label>Project (Odoo)</label>
            <div class="project-info hidden" id="projectInfo">
                <div class="project-info-details">
                    <strong id="projectInfoNaam"></strong>
                    <span id="projectInfoAdres" class="project-adres"></span>
                </div>
            </div>
            <div class="no-project-msg hidden" id="noProjectMsg">
                <p>Geen project geselecteerd. Open deze pagina via de link in Odoo.</p>
            </div>
            <input type="hidden" id="projectOdooId">
            <div class="project-actions">
                <button type="button" class="btn btn-load" id="btnLaden" disabled>Herladen uit Odoo</button>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button type="button" class="tab active" data-tab="invoer">Invoer</button>
            <button type="button" class="tab" data-tab="rolverdeling">Rolverdeling</button>
        </div>

        <!-- Tab: Invoer -->
        <div class="tab-content active" id="tab-invoer">
            <div id="blokkenContainer"></div>

            <div class="actions-bar">
                <button type="button" class="btn btn-add" id="btnAddBlok">+ Gebouw</button>
            </div>

            <div class="submit-bar">
                <button type="button" class="btn btn-save" id="btnOpslaan">Opslaan naar Odoo</button>
            </div>

            <div id="statusMsg" class="status-msg hidden"></div>
        </div>

        <!-- Tab: Rolverdeling -->
        <div class="tab-content" id="tab-rolverdeling">
            <div class="rv-layout">
                <div class="rv-main">
                    <div class="rv-rollen-config">
                        <h3>Beschikbare rollen</h3>
                        <div class="rv-rollen-lijst" id="rvRollenLijst"></div>
                        <div class="rv-rol-toevoegen">
                            <select id="rvRolGrootte">
                                <option value="600">600 m</option>
                                <option value="240">240 m</option>
                                <option value="200">200 m</option>
                                <option value="120">120 m</option>
                                <option value="100">100 m</option>
                            </select>
                            <input type="number" id="rvRolAantal" value="1" min="1" placeholder="Aantal">
                            <button type="button" class="btn btn-add" id="btnAddRol">+ Rol</button>
                        </div>
                    </div>

                    <div id="rvCollectorenOverzicht" class="rv-collectoren-overzicht"></div>
                </div>

                <div class="rv-sidebar">
                    <div class="rv-stats" id="rvStats"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
