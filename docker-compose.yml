version: "3.8"

services:
  thermoduct-admin:
    build: .
    container_name: thermoduct-admin
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.thermoduct-admin.rule=Host(`admin.thermoduct.be`)"
      - "traefik.http.routers.thermoduct-admin.entrypoints=websecure"
      - "traefik.http.routers.thermoduct-admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.thermoduct-admin.loadbalancer.server.port=80"
    networks:
      - proxy

networks:
  proxy:
    external: true
