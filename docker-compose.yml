version: "3.8"

services:
  thermoduct-dashboard:
    build: .
    container_name: thermoduct-dashboard
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.thermoduct-dashboard.rule=Host(`dashboard.thermoduct.be`)"
      - "traefik.http.routers.thermoduct-dashboard.entrypoints=websecure"
      - "traefik.http.routers.thermoduct-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.thermoduct-dashboard.loadbalancer.server.port=80"
    networks:
      - proxy

networks:
  proxy:
    external: true
